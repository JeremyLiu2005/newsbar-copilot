# 11/06 實跑用。門檻與權重。用 12:00–12:20 調參，12:20–13:00 只測試、不再修改。
version: 0.1

ocr:
  confusions: [[促鍆, 促銷], [牙叉, 貨叉], [拒撿, 拒檢], [偷瀆, 偷渡]]   # 已知常見誤辨，只當線索（OCR-V3），要影格或同則標題佐證才修正
  # min_conf: 0.6   # 不設定時依後端：PaddleOCR 0.6、Apple Vision 0.3（Vision 信心值只有 0.3/0.5/1.0 三級）
  vote_window_sec: 5

ad_state:
  min_signals: 2
  min_duration_sec: 10
  return_confirm_sec: 5
  outage_black_sec: 30
  layout_sim_threshold: 0.55

segmenter:
  bar_change_jaccard: 0.5
  same_story_cosine: 0.75
  weights: { bar: 0.5, asr: 0.3, visual: 0.2 }
  threshold: 0.6
  asr_window_sec: 20
  visual_window_sec: 5

labeler:
  generator: ollama
  parallel: 4             # 同時送出的 LLM 請求數
  host: http://127.0.0.1:11435   # 專用 Ollama：OLLAMA_NUM_PARALLEL=4（預設 App 只開 1 槽，請求會排隊）
  model: qwen2.5:7b-instruct
  allow_external: false   # NFR-14：外部 LLM 只送 bar 文字與 200 字內語音節錄
  min_len: 5             # 五字標剛好 5 字（三立 11/22：五字標只能 5 個字）；改成 4／6 為測試版 4–6 字
  max_len: 5
  target_len: 5
  retries: 2              # 失敗時帶具體原因重寫，最多 2 次

output:
  ad_label: 廣告
  weather_label: 氣象
  outage_label: 訊號中斷
  multi_sep: /
  minute_rule: next     # 秒級換題從下一分鐘起寫、一格一則（三立 11/22）；floor＝10/26 範例寫法

fingerprint:
  library: data/ad_library_1106_fast.npz   # 確認過的廣告聲音會自動加入，下次同一支廣告直接命中（AD-f）

cross_channel:
  enabled: true
  window_sec: 900

# labeler.generator: rule（不用 LLM）| ollama（地端，預設建議）| claude（外部，需 allow_external: true）

asr:
  # 準確模式 small（Mac M4 四台一小時約 31–35 分鐘）；快速模式 base（約 10 分鐘，11/06 TVBS 13 分鐘換題 F1 0.94→0.82）
  model: base
