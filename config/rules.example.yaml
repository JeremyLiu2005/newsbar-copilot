# 門檻與權重。用 12:00–12:20 調參，12:20–13:00 只測試、不再修改。
version: 0.1

ocr:
  confusions: [[促鍆, 促銷], [牙叉, 貨叉], [拒撿, 拒檢], [偷瀆, 偷渡], [搢破, 摜破]]   # 已知常見誤辨，只當線索（OCR-V3），要影格或同則標題佐證才修正
  # min_conf: 0.6   # 不設定時依後端：PaddleOCR 0.6、Apple Vision 0.3（Vision 信心值只有 0.3/0.5/1.0 三級）
  vote_window_sec: 5

ad_state:
  min_signals: 2
  min_duration_sec: 10
  return_confirm_sec: 5
  outage_black_sec: 30
  layout_sim_threshold: 0.55
  mode: rules             # rules（預設）| learned（需 model；見 README「RAG 與 ML」）
  # model: active         # 模型檔路徑，或 active（data/models/active.json）

segmenter:
  bar_change_jaccard: 0.5
  same_story_cosine: 0.75
  weights: { bar: 0.5, asr: 0.3, visual: 0.2 }
  threshold: 0.6
  mode: rules             # rules（預設）| learned
  # model: active
  asr_window_sec: 20
  visual_window_sec: 5

labeler:
  generator: nvidia       # 雲端優先（R21）；沒金鑰／沒網路 → 本機 Ollama（R21-2）；本機也沒有 → 規則擷取。改成 ollama 只用本機、rule 不用 LLM
  fallback: ollama
  fallback_model: qwen2.5:7b-instruct
  image_rewrite: true     # IMG-1：都沒過檢查時看主標題列截圖重寫
  allow_external: true    # NFR-14：只送主標題文字（讀不到才附 200 字內語音）與標題列裁切圖；金鑰放環境變數 NVIDIA_API_KEY
  parallel: 2
  model: qwen2.5:7b-instruct
  min_len: 5             # 五字標剛好 5 字（三立 11/22：五字標只能 5 個字）；改成 4／6 為測試版 4–6 字
  max_len: 5
  target_len: 5
  retries: 2              # 失敗時帶具體原因重寫，最多 2 次
  rag:                    # 檢索增強：從 KB 取相似標題的（標題, 五字標）當額外範例；預設關閉
    enabled: false
    k: 3
    kb: data/kb/labels.jsonl

output:
  ad_label: 廣告
  weather_label: 氣象
  outage_label: 訊號中斷
  multi_sep: /
  minute_rule: next     # 秒級換題從下一分鐘起寫、一格一則（三立 11/22）；floor＝10/26 範例寫法

fingerprint:
  library: data/ad_library.npz   # 確認過的廣告聲音會自動加入，下次同一支廣告直接命中（AD-f）

cross_channel:
  enabled: true
  window_sec: 900

# labeler.generator: rule（不用 LLM）| ollama（地端，預設建議）| claude 或 nvidia（外部，需 allow_external: true；nvidia 金鑰放環境變數 NEWSBAR_LLM_API_KEY 或 NVIDIA_API_KEY）
