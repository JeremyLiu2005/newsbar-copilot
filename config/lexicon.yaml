# 社會新聞關鍵字：只放犯罪、意外、災害用語（標題含任一個就要求五字標帶地點；沒有地點的來源則保留標籤、列入抽查）。
# 刻意不放「搶、偷、死、傷、殺」單字：搶攻、偷渡、哀傷、殺盤這類一般新聞也會誤中。
social_keywords: [撞, 輾, 車禍, 翻車, 火警, 火災, 火燒, 起火, 爆炸, 縱火, 汽油彈, 槍, 毒駕, 毒犯, 販毒, 吸毒, 毒品, 詐騙, 詐團, 電詐, 詐欺, 車手, 殺人, 砍殺, 刺殺, 殺害, 命案, 死亡, 身亡, 喪命, 不治, 致死, 撞死, 死傷, 傷亡, 受傷, 重傷, 輕傷, 墜樓, 墜落, 墜海, 墜崖, 溺水, 溺斃, 竊盜, 偷竊, 搶劫, 搶奪, 搶案, 虐待, 兒虐, 虐童, 毆打, 鬥毆, 行兇, 持刀, 勒索, 酒駕, 失蹤, 逃逸, 肇逃, 逮捕, 遭逮, 拘提, 聲押, 羈押]

# 未確認語氣：來源有這些字，五字標就不能把它拿掉（否則等於把傳聞寫成定論）。
# 兩個字以上的（疑似、傳出、涉嫌、據傳）拿掉就退件重寫；單字的（疑、傳、恐、涉）只列入抽查，不退件。
hedge_markers: [疑似, 疑, 傳出, 傳, 恐將, 恐怕, 恐, 涉嫌, 涉, 據傳, 可能, 爆料]
# 含有上面單字、但意思不是「未確認」的詞，比對前先忽略
hedge_exclusions: [涉案, 宣傳, 傳統, 傳播, 傳承, 傳送, 傳單, 傳真, 傳達, 傳輸, 轉傳, 流傳, 相傳, 傳教, 傳記, 傳奇, 傳說, 傳染, 傳遞, 傳喚, 傳訊, 傳媒, 傳動, 遺傳, 恐怖, 恐慌, 恐龍, 恐懼, 恐嚇, 驚恐, 恐同, 涉及, 交涉, 干涉, 跋涉, 涉外, 涉水, 懷疑, 質疑, 疑問, 疑慮, 疑惑, 疑難, 遲疑, 猶疑, 疑點]

# 畫面疊字：主標題條 OCR 結果裡單獨出現的這些字樣會被刪掉再做換題判斷
# 英文字樣不分大小寫、貼著中文也刪；中文字樣只有「獨立一段」才刪（避免傷到「最新民調」）
overlay_tokens: [LIVE直播, LIVE, 現場直播, 直播, 獨家, 最新]
# 角落天氣：獨立一段的溫度（28°C、28°、28度）
overlay_patterns: ['^\d+(\.\d+)?\s*(°\s*[CcＣ]?|℃)$', '^\d+(\.\d+)?\s*度$']
