[project]
name = "newsbar"
version = "0.1.0"
description = "新聞監看全自動填表"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
newsbar = "newsbar.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsbar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
