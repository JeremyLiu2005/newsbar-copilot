[project]
name = "newsbar"
version = "0.1.0"
description = "新聞監看全自動填表"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jieba>=0.42.1",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
newsbar = "newsbar.cli:main"

[project.optional-dependencies]
mac = [
    "pyobjc-framework-vision>=10",
]
asr = [
    "faster-whisper>=1.0",
]
# NVIDIA GPU server (Linux + CUDA). paddlepaddle-gpu must match the CUDA version; see README「GPU 版」.
gpu = [
    "faster-whisper>=1.0",
    "paddleocr>=2.7,<3",
    "paddlepaddle-gpu>=2.6,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsbar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
